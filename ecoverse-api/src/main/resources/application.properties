spring.application.name=ecoverse-api

# Database Configuration - env vars with local fallback
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/ecoverse_db}
spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Allow bean definition overriding (fix duplicate beans from multiple modules)
spring.main.allow-bean-definition-overriding=true

# JWT Configuration
jwt.secret=ecoverse-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUD_NAME:}
cloudinary.api_key=${API_KEY:}
cloudinary.secret_key=${SECRET_KEY:}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

app.mail.from="ecoversesystem2026@gmail.com"
app.mail.loginUrl="https://your-frontend-domain.com/login"
