# Application name
spring.application.name=ecoverse-auth

# Server port
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/ecoverse_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=ecoverse-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Logging
logging.level.com.fpt.ecoverseauth=DEBUG
logging.level.org.springframework.security=DEBUG
